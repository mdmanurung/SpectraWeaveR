[workspace]
name = "spectraweaver"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
description = "R environment for SpectraWeaveR (spectral flow cytometry pipeline)"

[dependencies]
r-base = "4.4.*"
# compilers for GitHub source installs
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
make = "*"
pkg-config = "*"
git = "*"
# Imports
bioconductor-flowcore = "*"
bioconductor-flowworkspace = "*"
bioconductor-opencyto = "*"
bioconductor-peacoqc = "*"
r-kohonen = "*"
r-dplyr = ">=1.1.0"
r-tibble = "*"
# Suggests (CRAN / Bioconductor)
bioconductor-ggcyto = "*"
bioconductor-edger = "*"
bioconductor-limma = "*"
bioconductor-diffcyt = "*"
r-s7 = "*"
r-ggplot2 = "*"
r-uwot = "*"
r-pheatmap = "*"
r-targets = "*"
r-readxl = "*"
r-ellmer = "*"
r-testthat = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-quarto = "*"
quarto = "*"
# dependencies of the GitHub packages, so they install without CRAN source builds
r-remotes = "*"
r-devtools = "*"
r-roxygen2 = "*"
r-pkgload = "*"
r-jsonlite = "*"
"r-data.table" = "*"
r-rcpp = "*"
r-rcpparmadillo = "*"
r-rcppeigen = "*"
r-rcppprogress = "*"
r-rcppannoy = "*"
r-igraph = "*"
r-matrix = "*"
r-cli = "*"
bioconductor-sva = "*"
r-emdist = "*"
r-outliers = "*"
r-pbmcapply = "*"
r-magrittr = "*"
r-tidyr = "*"
r-stringr = "*"
r-readr = "*"
r-ggridges = "*"
r-ggpubr = "*"
r-cowplot = "*"
r-rcolorbrewer = "*"
r-viridis = "*"
r-plyr = "*"
r-gridextra = "*"
r-skimr = "*"
rust = "*"
udunits2 = ">=2.2.28,<3"
gdal = ">=3.13.3,<4"
r-units = ">=1.0_1,<2"
r-sf = ">=1.1_3,<2"
libboost-devel = ">=1.92.0,<2"
r-ggprism = ">=1.0.7,<2"
r-ggh4x = ">=0.3.1,<0.4"
r-reactable = ">=0.4.5,<0.5"
r-lme4 = ">=1.1_37"

[activation.env]
# Library lives inside the project; ~/.Renviron is bypassed so its R_LIBS_USER is ignored.
R_LIBS_USER = "$PIXI_PROJECT_ROOT/.pixi/Rlib"
R_ENVIRON_USER = "$PIXI_PROJECT_ROOT/.pixi/Renviron.none"
R_PROFILE_USER = "$PIXI_PROJECT_ROOT/.pixi/Rprofile.none"
R_MAKEVARS_USER = "$PIXI_PROJECT_ROOT/.pixi/Makevars.none"
RENV_CONFIG_AUTOLOADER_ENABLED = "FALSE"

[tasks]
setup = "bash tools/setup_pixi_env.sh"
test = "Rscript -e 'devtools::test()'"
document = "Rscript -e 'devtools::document()'"
check = "Rscript -e 'devtools::check(vignettes = FALSE, build_args = \"--no-build-vignettes\", args = c(\"--no-manual\"))'"
